<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: Etch-A-Sketch</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="button-container">
        <button class="change-number-squares">Click Me to change the number of squares</button>
        <div class="heading">
            <div class="heading-title">A simple digital Etch-A-Sketch</div>
            <div class="description">To start drawing, press your mouse down and glide over the squares to create beautiful trails of color.</div>
            <div class="description">To stop drawing, simply release the mouse. Click any colored square to remove the color.</div>
        </div>
        <button class="clear-colors">Click Me to clear all colors</button>    
        <dialog id="custom-modal" class="modal-box">
            <div class="modal-content">
                <div class="modal-heading">Number of squares</div>
                <div class="input-section">
                    <label for="input-squares">Enter a number between 2 and 100:</label>
                    <input id="input-squares" type="text">
                </div>
                <div class="modal-buttons">
                    <button id="continue-button">Continue</button>
                    <button id="cancel-button">Cancel</button>
                </div>
             
            </div>

        </dialog>
    </div>
    <div class="squares-container"></div>
    <div class="footer">TOP project by Cherry © 2026</div>

    <script type="module" src="./script.js"></script>
</body>
</html>
